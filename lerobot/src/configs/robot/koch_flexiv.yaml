_target_: lerobot.common.robot_devices.robots.flexiv.FlexivRobot
robot_type: flexiv 

leader_arm:
  robot_path: configs/robot/koch_leader.yaml
  visualize: false

ips:
  robot_ip: 192.168.2.100
  local_ip: 192.168.2.102

cameras:
  wrist:
    _target_: lerobot.common.robot_devices.cameras.mvs.MVSWrapperCamera
    serial: "DA8942731"
    exposure: 20000
    fps: 30
    width: 640
    height: 480

# ~ Koch specific settings ~
# Sets the leader arm in torque mode with the gripper motor set to this angle. This makes it possible
# to squeeze the gripper and have it spring back to an open position on its own.
gripper_open_degree: 35.156
